name: Backend CI/CD

on:
  push:
    branches: [ main, lab7-cicd ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Web-prog_server/Web-prog_server.sln

      - name: Build project
        run: dotnet build Web-prog_server/Web-prog_server.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test Web-prog_server/Web-prog_server.sln --no-build --configuration Release

  publish-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name for Docker tag
        id: string_case
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Web-prog_server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.string_case.outputs.lowercase }}-backend:latest
            ghcr.io/${{ steps.string_case.outputs.lowercase }}-backend:${{ github.sha }}